        run: |
          set -eu
          VERSION='${{ inputs.version }}'
          work=/tmp/yamlstar-release
          rm -rf "$work"
          mkdir -p "$work"
          tar -xf "release-artifacts/yamlstar-$VERSION-freebsd-x64.tar.xz" \
