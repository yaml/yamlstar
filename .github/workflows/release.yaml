        !inputs.publish_homebrew_only &&
        contains(format(' {0} ', inputs.tests_only), ' windows-arm64 ') &&
        inputs.test_artifacts_run_id != ''
      }}
    runs-on: windows-11-arm
    permissions:
      actions: read
      contents: read
    steps:
    - name: Checkout ref
      uses: actions/checkout@v5

    - name: Download Windows ARM64 artifacts
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh run download "${{ inputs.test_artifacts_run_id }}" \
          --repo "${{ github.repository }}" \
          --name windows-arm64 \
          --dir release-artifacts

    - name: Configure archive tools
      run: |
        echo 'TAR_OPTIONS=--force-local' >> "$GITHUB_ENV"
        echo 'UNZIP=-o' >> "$GITHUB_ENV"

    - name: Install release artifacts
      run: util/install-release-artifacts release-artifacts

    - name: Smoke test CLI
      run: |
        cli/bin/yaml.exe --version
        [[ $(printf 'a: 1\n' | cli/bin/yaml.exe) == '{"a":1}' ]]

  test-wasm-p1-retry:
    name: Test WASI Preview 1 artifact (retry)
    if: >-
      ${{
        !inputs.publish_bindings_only &&
        !inputs.publish_homebrew_only &&
        contains(format(' {0} ', inputs.tests_only), ' wasm-p1 ') &&
        inputs.test_artifacts_run_id != ''
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
    - name: Checkout ref
      uses: actions/checkout@v5

    - name: Download WASI Preview 1 artifact
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh run download "${{ inputs.test_artifacts_run_id }}" \
          --repo "${{ github.repository }}" \
          --name wasm-p1 \
          --dir release-artifacts

    - name: Install Wasmtime
      run: |
        curl -sSf https://wasmtime.dev/install.sh |
          WASMTIME_HOME="$RUNNER_TEMP/wasmtime" bash
        echo "$RUNNER_TEMP/wasmtime/bin" >> "$GITHUB_PATH"

    - name: Smoke test CLI
      run: |
        mkdir release-wasm
        tar -xf "release-artifacts/yamlstar-$VERSION-wasm-p1.tar.xz" \
          -C release-wasm
        yaml_wasm="release-wasm/yamlstar-$VERSION-wasm-p1/yaml.wasm"
        wasmtime run "$yaml_wasm" --version
        [[ $(printf 'a: 1\n' |
          wasmtime run "$yaml_wasm") == '{"a":1}' ]]

  create-release:
    name: Create GitHub release
    if: ${{ !inputs.publish_bindings_only && !inputs.publish_homebrew_only && !inputs.tests_only }}
    needs:
    - test-linux
    - test-linux-aarch64
    - test-macos
    - test-macos-x64
    - test-freebsd-x64
    - test-windows
    - test-windows-arm64
    - test-wasm-p1
    - build-linux-x64
    - build-linux-aarch64
    - build-macos-arm64
    - build-macos-x64
    - build-windows-x64
    - build-cross-platform
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout tag
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.version }}

    - name: Build release notes
      run: |
        {
          echo "YAMLStar $VERSION"
          echo
          if [[ -f Changes ]]; then
            awk -v ver="$VERSION" '
              /^- version: / && $3 == ver { found = 1; next }
              /^- version: / && found { exit }
              found && $1 != "date:" && $1 != "changes:" { print }
            ' Changes | sed 's/^  - /* /'
          fi
        } > release-notes.txt
        cat release-notes.txt

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$VERSION" \
          --title "YAMLStar $VERSION" \
          --notes-file release-notes.txt \
          --draft=false \
          --prerelease=false

  upload-assets:
    name: Upload release assets
    if: ${{ !inputs.publish_bindings_only && !inputs.publish_homebrew_only && !inputs.tests_only }}
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout tag
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.version }}

    - name: Download release artifacts
      uses: actions/download-artifact@v7

    - name: Prepare release assets
      run: |
        find . -type f -name '*.tar.xz' -exec mv {} . \;
        find . -type f -name '*.zip' -exec mv {} . \;
        find . -type f -name '*.whl' -exec mv {} . \;
        ls -lh yamlstar-* libyamlstar-* *.whl

    - name: Upload release assets
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "$VERSION" \
          yamlstar-*.tar.xz yamlstar-*.zip libyamlstar-* *.whl --clobber
        gh release view "$VERSION"

  publish-homebrew:
    name: Publish Homebrew tap
    if: >-
      ${{
        always() &&
        !cancelled() &&
        !inputs.tests_only &&
        (
          inputs.publish_homebrew_only ||
          needs.upload-assets.result == 'success'
        )
      }}
    needs: upload-assets
    runs-on: ubuntu-latest
    env:
      YAMLSTAR_HOMEBREW_TAP_SSH_KEY: ${{ secrets.YAMLSTAR_HOMEBREW_TAP_SSH_KEY }}
    steps:
    - name: Checkout tag
      uses: actions/checkout@v5
      with:
        ref: >-
          ${{
            inputs.publish_homebrew_only &&
            github.ref ||
            inputs.version
          }}

    - name: Configure tap SSH key
      if: ${{ env.YAMLSTAR_HOMEBREW_TAP_SSH_KEY != '' }}
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ env.YAMLSTAR_HOMEBREW_TAP_SSH_KEY }}

    - name: Configure Git identity
      run: |
        git config --global user.name 'YAMLStar Release Bot'
        git config --global user.email 'yamlstar-release@yaml.com'

    - name: Publish Homebrew tap
      run: |
        if [[ -z "${YAMLSTAR_HOMEBREW_TAP_SSH_KEY:-}" ]]; then
          echo "ERROR: YAMLSTAR_HOMEBREW_TAP_SSH_KEY secret is not set"
          exit 1
        fi
        make release-homebrew n="$VERSION"

  publish-bindings:
    name: Publish language bindings
    if: >-
      ${{
        always() &&
        !cancelled() &&
        !inputs.tests_only &&
        !inputs.publish_homebrew_only &&
        (
          inputs.publish_bindings_only ||
          needs.upload-assets.result == 'success'
        )
      }}
    needs: upload-assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      YS_RELEASE_VERSION_NEW: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.YAMLSTAR_RELEASE_TOKEN || github.token }}
      GITHUB_TOKEN: ${{ secrets.YAMLSTAR_RELEASE_TOKEN || github.token }}
      CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
      CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
      CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
      HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      DUB_UPDATE_SECRET: ${{ secrets.DUB_UPDATE_SECRET }}
      LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
      MOONCAKES_USERNAME: ${{ secrets.MOONCAKES_USERNAME }}
      MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
      TATIN_USER: ${{ secrets.TATIN_USER }}
      TATIN_TOKEN: ${{ secrets.TATIN_TOKEN }}
      PAUSE_USER: ${{ secrets.PAUSE_USER }}
      PAUSE_PASS: ${{ secrets.PAUSE_PASS }}
      FEZ_USER: ${{ secrets.FEZ_USER }}
      FEZ_TOKEN: ${{ secrets.FEZ_TOKEN }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
      CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
      PACKAGIST_USER: ${{ secrets.PACKAGIST_USER }}
      PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
      YAMLSTAR_BINDING_REPO_SSH_KEY: ${{ secrets.YAMLSTAR_BINDING_REPO_SSH_KEY }}
    steps:
    - name: Checkout tag
      uses: actions/checkout@v5
      with:
        ref: >-
          ${{
            inputs.publish_bindings_only &&
            github.ref ||
            inputs.version
          }}
        fetch-depth: 0

    - name: Publish Go module tag
      run: |
        if git ls-remote --exit-code --tags origin \
          "refs/tags/v$VERSION" >/dev/null 2>&1; then
          echo "Go module tag v$VERSION already exists"
        else
          git tag "v$VERSION" "$VERSION^{commit}"
          git push origin "v$VERSION"
        fi

    - name: Download Linux release assets
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p release-artifacts
        gh release download "$VERSION" \
          --repo "${{ github.repository }}" \
          --pattern '*.tar.xz' \
          --dir release-artifacts
        mkdir -p python/dist
        gh release download "$VERSION" \
          --repo "${{ github.repository }}" \
          --pattern '*.whl' \
          --dir python/dist || true

    - name: Install release artifacts
      run: util/install-release-artifacts release-artifacts

    - name: Configure mirror repo SSH key
      if: ${{ env.YAMLSTAR_BINDING_REPO_SSH_KEY != '' }}
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ env.YAMLSTAR_BINDING_REPO_SSH_KEY }}

    - name: Configure npm credentials
      run: |
        if [[ -n "${NODE_AUTH_TOKEN:-}" ]]; then
          echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' \
            > ~/.npmrc
        fi

    - name: Configure GPG signing key
      if: ${{ env.GPG_PRIVATE_KEY != '' }}
      run: |
        printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

    - name: Configure Git identity
      run: |
        git config --global user.name 'YAMLStar Release Bot'
        git config --global user.email 'yamlstar-release@yaml.com'

    - name: Publish bindings
      run: make release-bindings v="$VERSION"

  publish-website:
    name: Publish website
    if: ${{ !inputs.publish_bindings_only && !inputs.publish_homebrew_only && !inputs.tests_only }}
    needs:
    - publish-bindings
    - publish-homebrew
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.YAMLSTAR_RELEASE_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.YAMLSTAR_RELEASE_TOKEN }}
    steps:
    - name: Checkout tag
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.version }}
        fetch-depth: 0
        token: ${{ secrets.YAMLSTAR_RELEASE_TOKEN }}

    - name: Configure Git identity
      run: |
        git config --global user.name 'YAMLStar Release Bot'
        git config --global user.email 'yamlstar-release@yaml.com'

    - name: Publish website
      run: |
        REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/yaml/yamlstar" \
          make release-website
