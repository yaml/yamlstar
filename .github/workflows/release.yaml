name: Release YAMLStar

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.4)'
        required: true
        type: string
      bindings:
        description: 'Optional space-separated binding directories'
        required: false
        type: string
      bindings_skip:
        description: 'Optional space-separated binding directories to skip'
        required: false
        type: string
      publish_bindings_only:
        description: 'Publish bindings from existing release assets'
        default: false
        required: false
        type: boolean
      publish_homebrew_only:
        description: 'Publish Homebrew tap from existing release assets'
        default: false
        required: false
        type: boolean
      tests_only:
        description: >-
          Only test these platforms (space-separated subset of:
          linux-x64 linux-aarch64 macos-arm64 macos-x64 freebsd-x64
          windows-x64 windows-arm64 wasm-p1); skips release and publish jobs
        default: ''
        required: false
        type: string
      test_artifacts_run_id:
        description: >-
          Prior release workflow run ID to take build artifacts from
          instead of building (use together with tests_only)
        required: false
        type: string
      force_bindings:
        description: 'Publish bindings even when the version already exists'
        default: false
        required: false
        type: boolean

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  JAVA_VERSION: '17'
  YS_RELEASE_CI: '1'
  YS_RELEASE_BINDINGS: ${{ inputs.bindings }}
  YS_RELEASE_BINDINGS_SKIP: ${{ inputs.bindings_skip }}
  YS_RELEASE_FORCE_BINDINGS: ${{ inputs.force_bindings && '1' || '' }}

jobs:
  verify-release:
    name: Verify release
    if: ${{ !inputs.publish_bindings_only && !inputs.publish_homebrew_only && !inputs.tests_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout tag
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.version }}
        fetch-depth: 0

    - name: Check tag and version
      run: |
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "ERROR: Invalid version: $VERSION"
          exit 1
        fi
        if ! git rev-parse "$VERSION" >/dev/null 2>&1; then
          echo "ERROR: Tag $VERSION does not exist"
          exit 1
        fi
        if [[ $(git rev-parse "$VERSION^{commit}") != \
              $(git rev-parse HEAD) ]]; then
          echo "ERROR: Tag $VERSION does not point to checkout HEAD"
          exit 1
        fi
        if [[ $(sed -n 's/^version: //p' Meta) != "$VERSION" ]]; then
          echo "ERROR: Meta version does not match $VERSION"
          exit 1
        fi

    - name: Check release assets are not already published
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh release view "$VERSION" --json assets --jq '.assets | length' \
           2>/dev/null | grep -q '^[1-9]'; then
          echo "ERROR: Release $VERSION already has assets"
          exit 1
        fi

  build-linux-x64:
    name: Build Linux x64
    if: ${{ !inputs.publish_bindings_only && !inputs.publish_homebrew_only && !inputs.tests_only }}
    needs: verify-release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout tag
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.version }}

    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: graalvm
        github-token: ${{ github.token }}
        native-image-job-reports: 'true'

    - name: Use GitHub Leiningen mirror
      run: |
        make --no-print-directory -n default >/dev/null
        python - <<'PY'
        from pathlib import Path
        p = Path('.cache/makes/lein.mk')
        text = p.read_text()
        text = text.replace(
          'https://codeberg.org/leiningen/leiningen/raw/tag',
          'https://raw.githubusercontent.com/technomancy/leiningen')
        text = text.replace(
          '\t$Q curl+ $(LEIN-DOWN) > $@\n',
          '\t$Q curl+ $(LEIN-DOWN) > $@\n'
          '\t$Q sed -i.bak \'s|export LEIN_VERSION=.*|export LEIN_VERSION="$(LEIN-VERSION)"|\' $@\n'
          '\t$Q sed -i.bak \'s|export LEIN_CHECKSUM=.*|export LEIN_CHECKSUM="5f5231f06c3c7924e3241e3dfa52885577fb44ddf8a9ea373d2c5e2f27217565"|\' $@\n')
        p.write_text(text)
        PY

    - name: Build release archives and Python wheel
      run: |
        make release-lib VERSION="$VERSION"
        make release-cli VERSION="$VERSION"
        make -C python wheel VERSION="$VERSION"

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v6
      with:
        name: linux-x64
        path: |
          dist/yamlstar-${{ inputs.version }}-linux-x64.tar.xz
          dist/libyamlstar-${{ inputs.version }}-linux-x64.tar.xz
          python/dist/*.whl
        retention-days: 7

  build-linux-aarch64:
    name: Build Linux AArch64
    if: ${{ !inputs.publish_bindings_only && !inputs.publish_homebrew_only && !inputs.tests_only }}
    needs: verify-release
    runs-on: ubuntu-24.04-arm
    container: ubuntu:20.04
    steps:
    - name: Install checkout dependencies
      run: |
        apt-get update
        apt-get install -y git

    - name: Checkout tag
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.version }}

    - name: Configure Git workspace
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git rev-parse --git-common-dir

    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: graalvm
        github-token: ${{ github.token }}
        native-image-job-reports: 'true'

    - name: Install build dependencies
      run: |
        apt-get update
        apt-get install -y build-essential curl git python3 unzip xz-utils zlib1g-dev

    - name: Use GitHub Leiningen mirror
      run: |
        make --no-print-directory -n default >/dev/null
        python3 - <<'PY'
        from pathlib import Path
        p = Path('.cache/makes/lein.mk')
        text = p.read_text()
        text = text.replace(
          'https://codeberg.org/leiningen/leiningen/raw/tag',
          'https://raw.githubusercontent.com/technomancy/leiningen')
        text = text.replace(
          '\t$Q curl+ $(LEIN-DOWN) > $@\n',
          '\t$Q curl+ $(LEIN-DOWN) > $@\n'
          '\t$Q sed -i.bak \'s|export LEIN_VERSION=.*|export LEIN_VERSION="$(LEIN-VERSION)"|\' $@\n'
          '\t$Q sed -i.bak \'s|export LEIN_CHECKSUM=.*|export LEIN_CHECKSUM="5f5231f06c3c7924e3241e3dfa52885577fb44ddf8a9ea373d2c5e2f27217565"|\' $@\n')
        p.write_text(text)
        PY

    - name: Build release archives
      run: |
        make release-lib VERSION="$VERSION"
        make release-cli VERSION="$VERSION"

    - name: Upload Linux AArch64 artifacts
      uses: actions/upload-artifact@v6
      with:
        name: linux-aarch64
        path: |
          dist/yamlstar-${{ inputs.version }}-linux-aarch64.tar.xz
          dist/libyamlstar-${{ inputs.version }}-linux-aarch64.tar.xz
        retention-days: 7

  build-macos-arm64:
    name: Build macOS ARM64
    if: ${{ !inputs.publish_bindings_only && !inputs.publish_homebrew_only && !inputs.tests_only }}
    needs: verify-release
    runs-on: macos-latest
    steps:
    - name: Checkout tag
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.version }}

    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: graalvm
        github-token: ${{ github.token }}
        native-image-job-reports: 'true'

    - name: Use GitHub Leiningen mirror
      run: |
        make --no-print-directory -n default >/dev/null
        python - <<'PY'
        from pathlib import Path
        p = Path('.cache/makes/lein.mk')
        text = p.read_text()
        text = text.replace(
          'https://codeberg.org/leiningen/leiningen/raw/tag',
          'https://raw.githubusercontent.com/technomancy/leiningen')
        text = text.replace(
          '\t$Q curl+ $(LEIN-DOWN) > $@\n',
          '\t$Q curl+ $(LEIN-DOWN) > $@\n'
          '\t$Q sed -i.bak \'s|export LEIN_VERSION=.*|export LEIN_VERSION="$(LEIN-VERSION)"|\' $@\n'
          '\t$Q sed -i.bak \'s|export LEIN_CHECKSUM=.*|export LEIN_CHECKSUM="5f5231f06c3c7924e3241e3dfa52885577fb44ddf8a9ea373d2c5e2f27217565"|\' $@\n')
        p.write_text(text)
        PY

    - name: Build release archives and Python wheel
      run: |
        make release-lib VERSION="$VERSION"
        make release-cli VERSION="$VERSION"
        make -C python wheel VERSION="$VERSION"

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v6
      with:
        name: macos-arm64
        path: |
          dist/yamlstar-${{ inputs.version }}-macos-arm64.tar.xz
          dist/libyamlstar-${{ inputs.version }}-macos-arm64.tar.xz
          python/dist/*.whl
        retention-days: 7

  build-macos-x64:
    name: Build macOS x64
    if: ${{ !inputs.publish_bindings_only && !inputs.publish_homebrew_only && !inputs.tests_only }}
    needs: verify-release
    runs-on: macos-15-intel
    steps:
    - name: Checkout tag
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.version }}

    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: graalvm
        github-token: ${{ github.token }}
        native-image-job-reports: 'true'

    - name: Use GitHub Leiningen mirror
      run: |
        make --no-print-directory -n default >/dev/null
        python - <<'PY'
        from pathlib import Path
        p = Path('.cache/makes/lein.mk')
        text = p.read_text()
        text = text.replace(
          'https://codeberg.org/leiningen/leiningen/raw/tag',
          'https://raw.githubusercontent.com/technomancy/leiningen')
        text = text.replace(
          '\t$Q curl+ $(LEIN-DOWN) > $@\n',
          '\t$Q curl+ $(LEIN-DOWN) > $@\n'
          '\t$Q sed -i.bak \'s|export LEIN_VERSION=.*|export LEIN_VERSION="$(LEIN-VERSION)"|\' $@\n'
          '\t$Q sed -i.bak \'s|export LEIN_CHECKSUM=.*|export LEIN_CHECKSUM="5f5231f06c3c7924e3241e3dfa52885577fb44ddf8a9ea373d2c5e2f27217565"|\' $@\n')
        p.write_text(text)
        PY

    - name: Check out Glojure source
      run: |
        glojure_version=$(
          sed -n 's/^GLOJURE-VERSION ?= //p' .cache/makes/glojure.mk
        )
        git clone --depth=1 --branch "v$glojure_version" \
          https://github.com/glojurelang/glojure \
          .cache/glojure-source

    - name: Build release archives and Python wheel
      run: |
        make release-lib VERSION="$VERSION" \
          TEST-WITH-GLOJURE="$PWD/.cache/glojure-source"
        make release-cli VERSION="$VERSION" \
          YAMLSTAR_GLOJURE=1 \
          TEST-WITH-GLOJURE="$PWD/.cache/glojure-source"
        make -C python wheel VERSION="$VERSION"

    - name: Upload macOS x64 artifacts
      uses: actions/upload-artifact@v6
      with:
        name: macos-x64
        path: |
          dist/yamlstar-${{ inputs.version }}-macos-x64.tar.xz
          dist/libyamlstar-${{ inputs.version }}-macos-x64.tar.xz
          python/dist/*.whl
        retention-days: 7

  build-windows-x64:
    name: Build Windows x64
    if: ${{ !inputs.publish_bindings_only && !inputs.publish_homebrew_only && !inputs.tests_only }}
    needs: verify-release
    runs-on: windows-latest
    steps:
    - name: Checkout tag
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.version }}

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: graalvm
        github-token: ${{ github.token }}
        native-image-job-reports: 'true'

    - name: Install native build tools and zip
      run: choco install mingw zip -y

    - name: Install shasum shim
      run: |
        mkdir -p "$RUNNER_TEMP/bin"
        {
          echo '#!/usr/bin/env bash'
          echo 'if [[ ${1:-} == -a && ${2:-} == 256 && ${3:-} == -c ]]; then'
          echo '  sha256sum -c'
          echo 'else'
          echo '  echo "Unsupported shasum arguments: $*" >&2'
          echo '  exit 2'
          echo 'fi'
        } > "$RUNNER_TEMP/bin/shasum"
        chmod +x "$RUNNER_TEMP/bin/shasum"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    - name: Use GitHub Leiningen mirror
      run: |
        make --no-print-directory -n default >/dev/null
        python - <<'PY'
        from pathlib import Path
        p = Path('.cache/makes/lein.mk')
        text = p.read_text()
        text = text.replace(
          'https://codeberg.org/leiningen/leiningen/raw/tag',
          'https://raw.githubusercontent.com/technomancy/leiningen')
        text = text.replace(
          '\t$Q curl+ $(LEIN-DOWN) > $@\n',
          '\t$Q curl+ $(LEIN-DOWN) > $@\n'
          '\t$Q sed -i.bak \'s|export LEIN_VERSION=.*|export LEIN_VERSION="$(LEIN-VERSION)"|\' $@\n'
          '\t$Q sed -i.bak \'s|export LEIN_CHECKSUM=.*|export LEIN_CHECKSUM="5f5231f06c3c7924e3241e3dfa52885577fb44ddf8a9ea373d2c5e2f27217565"|\' $@\n')
        p.write_text(text)
        PY

    - name: Build release archives and Python wheel
      run: |
        gloat_path="$(cygpath -u "$RUNNER_TEMP")/bin:/c/mingw64/bin:/mingw64/bin:/usr/bin:/bin"
        PATH="$gloat_path" make release-lib VERSION="$VERSION"
        make release-cli VERSION="$VERSION"
        make -C python wheel VERSION="$VERSION"

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v6
      with:
        name: windows-x64
        path: |
          dist/yamlstar-${{ inputs.version }}-windows-x64.zip
          dist/libyamlstar-${{ inputs.version }}-windows-x64.zip
          python/dist/*.whl
        retention-days: 7

  build-cross-platform:
    name: Build ${{ matrix.name }}
    if: ${{ !inputs.publish_bindings_only && !inputs.publish_homebrew_only && !inputs.tests_only }}
    needs: verify-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: FreeBSD x64
          platform: freebsd-x64
          gloat_platform: freebsd/amd64
          cross_cc_target: x86_64-freebsd
          archive_ext: tar.xz
          shared_library: true
        - name: Windows ARM64
          platform: windows-arm64
          gloat_platform: windows/arm64
          cross_cc_target: aarch64-windows-gnu
          archive_ext: zip
          shared_library: true
        - name: WASI Preview 1
          platform: wasm-p1
          gloat_platform: wasip1/wasm
          archive_ext: tar.xz
          shared_library: false
    steps:
    - name: Checkout tag
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.version }}

    - name: Install build dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential curl git perl unzip xz-utils zip

    - name: Build CLI archive
      run: |
        make release-cli VERSION="$VERSION" \
          GLOAT_PLATFORM="${{ matrix.gloat_platform }}" \
          RELEASE_PLATFORM="${{ matrix.platform }}"

    - name: Build shared library archive
      if: ${{ matrix.shared_library }}
      run: |
        make release-lib VERSION="$VERSION" \
          GLOAT_PLATFORM="${{ matrix.gloat_platform }}" \
          RELEASE_PLATFORM="${{ matrix.platform }}" \
          CROSS_CC_TARGET="${{ matrix.cross_cc_target }}"

    - name: Stage release artifacts
      run: |
        mkdir release-output
        cp "dist/yamlstar-$VERSION-${{ matrix.platform }}.${{ matrix.archive_ext }}" \
          release-output/
        if ${{ matrix.shared_library }}; then
          cp "dist/libyamlstar-$VERSION-${{ matrix.platform }}.${{ matrix.archive_ext }}" \
            release-output/
        fi

    - name: Upload cross-platform artifacts
      uses: actions/upload-artifact@v6
      with:
        name: ${{ matrix.platform }}
        path: release-output/
        retention-days: 7

  test-linux:
    name: Test Linux artifacts
    if: ${{ !inputs.publish_bindings_only && !inputs.publish_homebrew_only && !inputs.tests_only }}
    needs: build-linux-x64
    runs-on: ubuntu-latest
    steps:
    - name: Checkout tag
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.version }}

    - name: Download Linux artifacts
      uses: actions/download-artifact@v7
      with:
        name: linux-x64
        path: release-artifacts

    - name: Install release artifacts
      run: util/install-release-artifacts release-artifacts

    - name: Smoke test CLI
      run: |
        cli/bin/yaml --version
        [[ $(printf 'a: 1\n' | cli/bin/yaml) == '{"a":1}' ]]

    - name: Use GitHub Leiningen mirror
      run: |
        make --no-print-directory -n default >/dev/null
        python - <<'PY'
        from pathlib import Path
        p = Path('.cache/makes/lein.mk')
        text = p.read_text()
        text = text.replace(
          'https://codeberg.org/leiningen/leiningen/raw/tag',
          'https://raw.githubusercontent.com/technomancy/leiningen')
        text = text.replace(
          '\t$Q curl+ $(LEIN-DOWN) > $@\n',
          '\t$Q curl+ $(LEIN-DOWN) > $@\n'
          '\t$Q sed -i.bak \'s|export LEIN_VERSION=.*|export LEIN_VERSION="$(LEIN-VERSION)"|\' $@\n'
          '\t$Q sed -i.bak \'s|export LEIN_CHECKSUM=.*|export LEIN_CHECKSUM="5f5231f06c3c7924e3241e3dfa52885577fb44ddf8a9ea373d2c5e2f27217565"|\' $@\n')
        p.write_text(text)
        PY

    - name: Run tests
      run: make test-all TEST-TIME='date; time' BINDING-SKIP="php $YS_RELEASE_BINDINGS_SKIP"

  test-linux-aarch64:
    name: Test Linux AArch64 artifacts
    if: ${{ !inputs.publish_bindings_only && !inputs.publish_homebrew_only && !inputs.tests_only }}
    needs: build-linux-aarch64
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Checkout tag
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.version }}

    - name: Download Linux AArch64 artifacts
      uses: actions/download-artifact@v7
      with:
        name: linux-aarch64
        path: release-artifacts

    - name: Install release artifacts
      run: util/install-release-artifacts release-artifacts

    - name: Smoke test CLI
      run: |
        cli/bin/yaml --version
        [[ $(printf 'a: 1\n' | cli/bin/yaml) == '{"a":1}' ]]

    - name: Use GitHub Leiningen mirror
      run: |
        make --no-print-directory -n default >/dev/null
        python - <<'PY'
        from pathlib import Path
        p = Path('.cache/makes/lein.mk')
        text = p.read_text()
        text = text.replace(
          'https://codeberg.org/leiningen/leiningen/raw/tag',
          'https://raw.githubusercontent.com/technomancy/leiningen')
        text = text.replace(
          '\t$Q curl+ $(LEIN-DOWN) > $@\n',
          '\t$Q curl+ $(LEIN-DOWN) > $@\n'
          '\t$Q sed -i.bak \'s|export LEIN_VERSION=.*|export LEIN_VERSION="$(LEIN-VERSION)"|\' $@\n'
          '\t$Q sed -i.bak \'s|export LEIN_CHECKSUM=.*|export LEIN_CHECKSUM="5f5231f06c3c7924e3241e3dfa52885577fb44ddf8a9ea373d2c5e2f27217565"|\' $@\n')
        p.write_text(text)
        PY

    - name: Run tests
      run: |
        make test-all \
          R-VERSION=4.6.0 \
          TEST-TIME='date; time' \
          BINDING-SKIP="crystal elixir erlang haskell lua php python raku rust $YS_RELEASE_BINDINGS_SKIP"

  test-macos:
    name: Test macOS artifacts
    if: ${{ !inputs.publish_bindings_only && !inputs.publish_homebrew_only && !inputs.tests_only }}
    needs: build-macos-arm64
    runs-on: macos-latest
    steps:
    - name: Checkout tag
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.version }}

    - name: Download macOS artifacts
      uses: actions/download-artifact@v7
      with:
        name: macos-arm64
        path: release-artifacts

    - name: Install release artifacts
      run: util/install-release-artifacts release-artifacts

    - name: Smoke test CLI
      run: |
        cli/bin/yaml --version
        [[ $(printf 'a: 1\n' | cli/bin/yaml) == '{"a":1}' ]]

    - name: Use GitHub Leiningen mirror
      run: |
        make --no-print-directory -n default >/dev/null
        python - <<'PY'
        from pathlib import Path
        p = Path('.cache/makes/lein.mk')
        text = p.read_text()
        text = text.replace(
          'https://codeberg.org/leiningen/leiningen/raw/tag',
          'https://raw.githubusercontent.com/technomancy/leiningen')
        text = text.replace(
          '\t$Q curl+ $(LEIN-DOWN) > $@\n',
          '\t$Q curl+ $(LEIN-DOWN) > $@\n'
          '\t$Q sed -i.bak \'s|export LEIN_VERSION=.*|export LEIN_VERSION="$(LEIN-VERSION)"|\' $@\n'
          '\t$Q sed -i.bak \'s|export LEIN_CHECKSUM=.*|export LEIN_CHECKSUM="5f5231f06c3c7924e3241e3dfa52885577fb44ddf8a9ea373d2c5e2f27217565"|\' $@\n')
        p.write_text(text)
        PY

    - name: Run tests
      run: make test-all TEST-TIME='date; time' BINDING-SKIP="delphi elixir erlang fortran fsharp haskell lua php powershell r rust zig $YS_RELEASE_BINDINGS_SKIP"

  test-macos-x64:
    name: Test macOS x64 artifacts
    if: ${{ !inputs.publish_bindings_only && !inputs.publish_homebrew_only && !inputs.tests_only }}
    needs: build-macos-x64
    runs-on: macos-15-intel
    steps:
    - name: Checkout tag
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.version }}

    - name: Download macOS x64 artifacts
      uses: actions/download-artifact@v7
      with:
        name: macos-x64
        path: release-artifacts

    - name: Install release artifacts
      run: util/install-release-artifacts release-artifacts

    - name: Smoke test CLI
      run: |
        cli/bin/yaml --version
        [[ $(printf 'a: 1\n' | cli/bin/yaml) == '{"a":1}' ]]

    - name: Use GitHub Leiningen mirror
      run: |
        make --no-print-directory -n default >/dev/null
        python - <<'PY'
        from pathlib import Path
        p = Path('.cache/makes/lein.mk')
        text = p.read_text()
        text = text.replace(
          'https://codeberg.org/leiningen/leiningen/raw/tag',
          'https://raw.githubusercontent.com/technomancy/leiningen')
        text = text.replace(
          '\t$Q curl+ $(LEIN-DOWN) > $@\n',
          '\t$Q curl+ $(LEIN-DOWN) > $@\n'
          '\t$Q sed -i.bak \'s|export LEIN_VERSION=.*|export LEIN_VERSION="$(LEIN-VERSION)"|\' $@\n'
          '\t$Q sed -i.bak \'s|export LEIN_CHECKSUM=.*|export LEIN_CHECKSUM="5f5231f06c3c7924e3241e3dfa52885577fb44ddf8a9ea373d2c5e2f27217565"|\' $@\n')
        p.write_text(text)
        PY

    - name: Run tests
