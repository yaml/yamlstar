# Demo numbers follow list order.
# {work} is a scratch directory.

- desc: Parse YAML with the native go-yaml parser
  cmnd: >-
    <<<$'answer: 42\nitems: [one, two]\n' env YAMLSTAR_CONFIG= yaml --no-install --plugin=yaml-parser=go-yaml -J
  impl: go-yaml

- desc: Parse YAML with the reference parser
  cmnd: >-
    <<<$'answer: 42\nitems: [one, two]\n' env YAMLSTAR_CONFIG= yaml --no-install --plugin=yaml-parser=reference -J
  impl: reference

- desc: Parse JSON-style comments with the JSON-comments parser
  cmnd: >-
    <<<$'{answer: true/* JSON block comment */} // line comment\n' env YAMLSTAR_CONFIG= yaml --no-install --plugin=yaml-parser=json-comments -J
  impl: json-comments

- desc: Parse YAML with the RapidYAML shared library
  cmnd: >-
    <<<$'answer: 42\nitems: [one, two]\n' env YAMLSTAR_CONFIG= yaml --plugin=yaml-parser=rapidyaml -J
  impl: rapidyaml

- desc: Parse TOML with the TOML shared library
  cmnd: >-
    <<<$'answer = 42\n[server]\nhost = "localhost"\n' env YAMLSTAR_CONFIG= yaml --plugin=yaml-parser=toml -J
  impl: toml

- desc: Emit YAML with the native go-yaml emitter
  cmnd: >-
    <<<$'answer: 42\nitems: [one, two]\n' env YAMLSTAR_CONFIG= yaml --no-install --plugin=yaml-emitter=go-yaml -y
  impl: go-yaml

- desc: Emit YAML with the reference emitter
  cmnd: >-
    <<<$'answer: 42\nitems: [one, two]\n' env YAMLSTAR_CONFIG= yaml --no-install --plugin=yaml-emitter=reference -y
  impl: reference

- desc: Load tab-indented YAML with tab-indent
  cmnd: >-
    <<<$'root:\n\tanswer: 42\n' env YAMLSTAR_CONFIG= yaml --no-install --plugin=yaml-parser=go-yaml\,tab-indent -J
  impl: go-yaml

- desc: Dump YAML using tabs with tab-indent
  cmnd: >-
    <<<$'root:\n  answer: 42\n' env YAMLSTAR_CONFIG= yaml --no-install --plugin=yaml-parser=go-yaml\,yaml-emitter=go-yaml\,tab-indent -y
  impl: go-yaml

- desc: Supply an external anchor through inline Alias-Data
  cmnd: >-
    <<<$'item: *defaults\n' env YAMLSTAR_CONFIG= yaml --no-install
    --config '{plugin: {alias-data: {data: {defaults: {color: blue, size: 3}}}}}'
    --plugin=alias-data -J
  impl: alias-data

- desc: Resolve an alias from a selected environment variable
  cmnd: >-
    <<<$'color: *PLUGIN_DEMO_COLOR\n' env YAMLSTAR_CONFIG= PLUGIN_DEMO_COLOR=blue
    yaml --no-install --config '{plugin: {alias-data: {env: PLUGIN_DEMO_COLOR}}}'
    --plugin=alias-data -J
  impl: alias-data

- desc: Resolve an alias from an Alias-Data file
  cmnd: >-
    printf %s $'defaults: {color: blue, size: 3}\n' > {work}/aliases.yaml && <<<$'item: *defaults\n' env YAMLSTAR_CONFIG= yaml --no-install --config "{plugin: {alias-data: {file: '{work}/aliases.yaml'}}}" --plugin=alias-data -J
  impl: alias-data

- desc: Reuse an anchor across documents with Alias-Data
  cmnd: >-
    <<<$'--- &defaults {color: blue}\n---\nitem: *defaults\n' env YAMLSTAR_CONFIG= yaml --no-install --plugin=alias-data -J
  impl: alias-data

- desc: Keep ordinary aliases while disabling cross-document reuse
  cmnd: >-
    <<<$'local: &value 42\ncopy: *value\n' env YAMLSTAR_CONFIG=
    yaml --no-install --config '{plugin: {alias-data: {stream: false}}}' -J
  impl: alias-data

- desc: Reject cross-document aliases with document scope
  cmnd: >-
    <<<$'--- &saved {value: 42}\n---\ncopy: *saved\n' env YAMLSTAR_CONFIG=
    yaml --no-install --config '{plugin: {alias-data: {stream: false}}}' -J
  fail: Unknown anchor

- desc: Reject aliases altogether with Alias-Data disable
  cmnd: >-
    <<<$'local: &value 42\ncopy: *value\n' env YAMLSTAR_CONFIG=
    yaml --no-install --config '{plugin: {alias-data: disable}}' -J
  fail: aliases are disabled

- desc: Select a nested mapping value through a dotted anchor path
  cmnd: >-
    <<<$'settings: &x1 {foo: {bar: 42}}\nanswer: *x1.foo.bar\n'
    env YAMLSTAR_CONFIG= yaml --no-install --from=yaml
    --config '{plugin: {alias-data: {path: true}}}' -J
  impl: alias-data

- desc: Select a sequence item and its mapping value through an anchor path
  cmnd: >-
    <<<$'items: &x2 [zero, one, two, {baz: found}]\nselected: *x2.3.baz\n'
    env YAMLSTAR_CONFIG= yaml --no-install --from=yaml
    --config '{plugin: {alias-data: {path: true}}}' -J
  impl: alias-data

- desc: Reuse a dotted anchor path across documents automatically
  cmnd: >-
    <<<$'--- &saved {foo: {bar: 42}}\n---\ncopy: *saved.foo.bar\n'
    env YAMLSTAR_CONFIG= yaml --no-install --from=yaml
    --config '{plugin: {alias-data: {path: true}}}' -J
  impl: alias-data

- desc: Keep dotted anchor paths within each document explicitly
  cmnd: >-
    <<<$'--- &saved {foo: 42}\n---\ncopy: *saved.foo\n'
    env YAMLSTAR_CONFIG= yaml --no-install --from=yaml
    --config '{plugin: {alias-data: {path: true, stream: false}}}' -J
  fail: unknown anchor

- desc: Report the failing segment in a missing anchor path
  cmnd: >-
    <<<$'settings: &saved {foo: 42}\ncopy: *saved.missing\n'
    env YAMLSTAR_CONFIG= yaml --no-install --from=yaml
    --config '{plugin: {alias-data: {path: true}}}' -J
  fail: missing mapping key

- desc: Select a numeric string mapping key using single quotes
  cmnd: >-
    <<<$'settings: &foo {\'42\': {bar: found}, \'042\': leading}\nselected: *foo.\'42\'.bar\nleading: *foo.\'042\'\n'
    env YAMLSTAR_CONFIG= yaml --no-install --from=yaml
    --config '{plugin: {alias-data: {path: true}}}' -J
  impl: alias-data

- desc: Reject a sequence index with a leading zero
  cmnd: >-
    <<<$'items: &foo [zero, one]\nselected: *foo.01\n'
    env YAMLSTAR_CONFIG= yaml --no-install --from=yaml
    --config '{plugin: {alias-data: {path: true}}}' -J
  fail: sequence index must not have leading zeros
